name: Laravel CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: ✅ Checkout Code
        uses: actions/checkout@v3

      - name: 🔐 Setup SSH Agent
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: 🚀 Deploy to Azure VM
        run: |
          ssh -o StrictHostKeyChecking=no azureuser@20.84.51.30 << 'EOF'
            set -e

            echo "📂 Changing to project directory..."
            cd /var/www/html/Lootrade

            echo "📥 Pulling latest code..."
            git reset --hard
            git pull origin main

            echo "📦 Installing PHP dependencies..."
            composer install --no-interaction --prefer-dist --optimize-autoloader

            echo "🔧 Fixing Laravel permissions..."
            bash /var/www/html/Lootrade/fix-perms.sh

            echo "🧱 Running Laravel migrations..."
            php artisan migrate --force

            echo "🧹 Optimizing Laravel..."
            php artisan optimize

            echo "📦 Installing Node modules..."
            npm ci --only=production

            echo "🔧 Fixing esbuild & vite permissions..."
            chmod +x node_modules/@esbuild/linux-x64/bin/esbuild || true
            chmod +x node_modules/.bin/vite || true

            echo "🚀 Building frontend with Vite..."
            npm run build

            echo "🔁 Restarting Laravel queue workers..."
            php artisan queue:restart

            echo "✅ Deployment completed successfully!"
          EOF
